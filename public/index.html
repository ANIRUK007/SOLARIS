<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0420" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SOLARIS" />
<meta name="format-detection" content="telephone=no" />
<title>SOLARIS</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- ══ SIGN IN ════════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-auth" hidden>
  <div class="center-col">
    <div class="brand">
      <div class="brand-ring"><div class="brand-dot"></div></div>
      <h1>SOLARIS</h1>
    </div>

    <p class="lede" id="authLede">Sign in to record.</p>

    <div class="field-group">
      <label for="auth-user">Username</label>
      <input id="auth-user" type="text" maxlength="32" autocomplete="username"
             autocapitalize="none" spellcheck="false" enterkeyhint="next" placeholder="fieldworker" />
    </div>

    <div class="field-group">
      <label for="auth-pass">Password</label>
      <input id="auth-pass" type="password" autocomplete="current-password"
             enterkeyhint="go" placeholder="••••••••" />
    </div>

    <div class="field-group" id="authNameRow" hidden>
      <label for="auth-name">Display name</label>
      <input id="auth-name" type="text" maxlength="60" autocomplete="name"
             enterkeyhint="go" placeholder="Your name" />
    </div>

    <div class="err-box" id="authErr" hidden></div>

    <span class="srv-state checking" id="srvState"><span class="dot"></span><span id="srvLbl">checking…</span></span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnAuthSubmit" type="button">Sign In</button>
    <button class="btn btn-ghost" id="btnAuthToggle" type="button">Create an account instead</button>
  </div>
</section>

<!-- ══ PORTAL ═════════════════════════════════════════════════════════════ -->
<section class="screen scrolls" id="screen-portal" hidden>
  <header class="portal-top">
    <div class="avatar" id="userAvatar">?</div>
    <div class="who">
      <div class="who-name" id="userName">—</div>
      <div class="who-lvl" id="userLevel">Level 1</div>
    </div>
    <div class="streak-pill" id="portalStreak" title="Words in a row">
      <span class="flame">🔥</span><span id="portalStreakVal">0</span>
    </div>
    <button class="icon-btn" id="btnSignOut" type="button" aria-label="Sign out" title="Sign out">⏻</button>
  </header>

  <div class="portal-body">
    <!-- XP toward the next level, earned per word contributed -->
    <div class="card level-card">
      <div class="level-row">
        <span class="level-badge" id="levelBadge">1</span>
        <div class="level-bar-wrap">
          <div class="level-meta">
            <span id="xpNow">0 XP</span>
            <span id="xpNext">120 XP to level 2</span>
          </div>
          <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
          <div class="level-sub"><span id="wordsDone">0 words</span> contributed</div>
        </div>
      </div>
    </div>

    <h2 class="section-title">Word sets</h2>
    <div class="pack-grid" id="packGrid"></div>

    <div class="queue-note" id="portalQueue" hidden></div>
  </div>
</section>

<!-- ══ SESSION ════════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-play" hidden>
  <div class="topbar">
    <button class="icon-btn" id="btnQuit" type="button" aria-label="End session">✕</button>
    <div class="segbar" id="segbar" role="progressbar" aria-label="Session progress"></div>
    <div class="streak-pill" id="streakBox" title="Consecutive good takes">
      <span class="flame">🔥</span><span id="streakVal">0</span>
    </div>
  </div>

  <div class="stage">
    <div class="instruction" id="instruction">Say this in <span class="lang">Banjara</span></div>

    <div class="prompt-card" id="promptCard">
      <span class="chip-cat" id="promptCat">—</span>
      <div class="word-te" id="promptWord" lang="te">—</div>
      <div class="word-translit" id="promptTranslit"></div>
      <div class="word-en" id="promptEn"></div>
      <button class="speak-btn" id="btnSpeak" type="button" hidden>🔊 Hear it in Telugu</button>
    </div>

    <div class="meter-wrap" id="meterWrap">
      <span class="meter-label" id="recTimer">00:00</span>
      <span class="meter"><span class="meter-bar" id="meterBar"></span></span>
    </div>

    <div class="err-box" id="playErr" hidden></div>
  </div>

  <div class="actions">
    <button class="btn btn-rec" id="btnRecord" type="button">
      <span class="rec-dot"></span><span id="recLabel">Tap to record</span>
    </button>
    <button class="btn btn-ghost" id="btnSkip" type="button">No Banjara word for this</button>
  </div>
</section>

<!-- ══ COMPLETE ═══════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-done" hidden>
  <div class="center-col">
    <div class="trophy" id="trophy">🏆</div>
    <div class="complete-title" id="doneTitle">Session complete</div>
    <div class="complete-sub" id="doneSub">Every word recorded and saved.</div>

    <div class="stat-grid">
      <div class="stat xp"><div class="v" id="statXp">0</div><div class="k">XP earned</div></div>
      <div class="stat acc"><div class="v" id="statRecorded">0</div><div class="k">Words recorded</div></div>
      <div class="stat best"><div class="v" id="statStreak">0</div><div class="k">Best streak</div></div>
      <div class="stat time"><div class="v" id="statTime">0m</div><div class="k">Time spent</div></div>
    </div>

    <div class="queue-note" id="queueNote" hidden></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnHome" type="button">Back to Word Sets</button>
  </div>
</section>

<!-- Feedback sheet, shared by all verdicts -->
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <div class="sheet-icon" id="sheetIcon">✓</div>
      <div>
        <div class="sheet-title" id="sheetTitle">Nice!</div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <div class="xp-badge" id="sheetXp" hidden>+0 XP</div>
    </div>
    <div class="metrics" id="sheetMetrics"></div>
    <div class="sheet-row">
      <button class="replay-btn" id="btnReplay" type="button" aria-label="Play the recording back">▶</button>
      <button class="btn btn-ghost" id="btnRetry" type="button">Retry</button>
      <button class="btn btn-primary" id="btnContinue" type="button">Continue</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script src="dsp.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
