# Deploy to Fly.io on a green push to main.
#
# Nothing secret is in this file. The Supabase credentials live as Fly secrets
# on the app itself, and the only thing GitHub holds is a deploy token. That
# token is the one credential worth guarding here: it can ship code, but it
# cannot read the archive.
#
# This repository is public. A service_role key committed to it would be
# scraped within minutes and bypasses row-level security on every table, which
# is why credentials are set with `fly secrets set` and never checked in.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # so a deploy can be run by hand after a rollback

concurrency:
  group: deploy
  cancel-in-progress: false   # never interrupt a deploy half-way

jobs:
  deploy:
    runs-on: ubuntu-latest

    # No token, no deploy. Without this the job fails noisily on every push for
    # anyone who has cloned the repository and never set one up.
    if: github.repository == 'ANIRUK007/SOLARIS'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deploying something that does not pass its own tests is how a field
      # deployment loses a day of recordings.
      - name: Tests
        env:
          SUPABASE_URL: ''
          SUPABASE_SERVICE_KEY: ''
        run: npm test

      - name: Check the deploy token is present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
